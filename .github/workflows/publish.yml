# Publishes to PyPI when a release is published on GitHub, with PyPI "trusted publishing" (no token in the
# repo): on pypi.org, add a publisher for the project "infitalk" with owner InfiArtt, repository
# infitalk-python, workflow publish.yml and environment pypi.
name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
